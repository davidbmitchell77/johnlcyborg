<template>
    <lightning-card title="picklists" icon-name="utility:list">
        <div class="slds-var-m-around_medium">
            <strong>{objectApiName}.{fieldApiName}</strong>
            <div class="slds-var-m-around_medium">
                <template for:each={picklistValues} for:item="entry">
                    <li key={entry.value}>{entry.value}</li>
                </template>
            </div>
            <lightning-button variant="brand" label="Go To Case Record"  onclick={handleClick}></lightning-button>&nbsp;&nbsp;
            <lightning-button variant="brand" label="Go To Account List" onclick={handleClick}></lightning-button>&nbsp;&nbsp;
            <lightning-button variant="brand" label="Show Toast"         onclick={handleClick}></lightning-button>
        </div>
    </lightning-card>
</template>
